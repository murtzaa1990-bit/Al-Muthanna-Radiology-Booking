<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إدارة الحجوزات - مستشفى المثنى الأهلي</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      color: #17202a;
    }

    header {
      background: #087f9c;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #087f9c;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #c0392b;
      float: left;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #087f9c;
      color: white;
    }

    #dashboard {
      display: none;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      table {
        font-size: 12px;
      }

      th, td {
        padding: 7px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>مستشفى المثنى الأهلي</h1>
  <div>قسم الأشعة والمفراس</div>
</header>

<div class="container">

  <div id="loginBox" class="card">
    <h2>تسجيل دخول الإدارة</h2>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
    >

    <button onclick="login()">تسجيل الدخول</button>

    <div id="message"></div>
  </div>

  <div id="dashboard">

    <div class="card">
      <button class="logout" onclick="logout()">تسجيل الخروج</button>

      <h2>حجوزات قسم الأشعة والمفراس</h2>
<div style="display:flex; gap:10px; flex-wrap:wrap; margin:15px 0;">

  <div style="flex:1; min-width:150px; background:#fff3cd; padding:15px; border-radius:10px; text-align:center;">
    <strong>🟡 قيد الانتظار</strong>
    <div id="pendingCount" style="font-size:24px; margin-top:8px;">0</div>
  </div>

  <div style="flex:1; min-width:150px; background:#d4edda; padding:15px; border-radius:10px; text-align:center;">
    <strong>🟢 تم الفحص</strong>
    <div id="completedCount" style="font-size:24px; margin-top:8px;">0</div>
  </div>

  <div style="flex:1; min-width:150px; background:#f8d7da; padding:15px; border-radius:10px; text-align:center;">
    <strong>🔴 ملغي</strong>
    <div id="cancelledCount" style="font-size:24px; margin-top:8px;">0</div>
  </div>
<div style="display:flex; gap:8px; flex-wrap:wrap; margin:15px 0;">
    <button onclick="filterByStatus('all')">📋 الكل</button>
    <button onclick="filterByStatus('pending')">🟡 قيد الانتظار</button>
    <button onclick="filterByStatus('completed')">🟢 تم الفحص</button>
    <button onclick="filterByStatus('cancelled')">🔴 ملغي</button>
</div>
</div>
      <p>الحجوزات المسجلة في النظام</p>
    </div>

    <div class="card" style="overflow-x:auto;">

        <input
  type="text"
  id="searchInput"
  placeholder="🔍 ابحث باسم المريض أو رقم الهاتف"
  oninput="searchAppointments()"
  style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:16px;"
>
      <input
  type="date"
  id="dateFilter"
  onchange="filterByDate()"
  style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:16px;"
>
      <select
  id="examFilter"
  onchange="filterByExam()"
  style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:16px;"
>
  <option value="">جميع الفحوصات</option>
  <option value="CT">CT - المفراس</option>
  <option value="X-Ray">X-Ray - الأشعة</option>
</select>
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
            <th>نوع الفحص</th>
            <th>التاريخ</th>
            <th>الوقت</th>
            <th>حالة الحجز</th>
          </tr>
        </thead>

        <tbody id="appointments">
        </tbody>

      </table>

      <p id="loading">جاري تحميل الحجوزات...</p>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://kpxonagjclpmwwoczwog.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Svs8n3EuWTtMngtjw6MEnA_QU-dd0z8";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  message.innerText = "جاري تسجيل الدخول...";

  const { data, error } =
    await client.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.innerText =
      "خطأ في البريد الإلكتروني أو كلمة المرور";

    return;
  }

  message.innerText = "";

  showDashboard();
}


async function logout() {

  await client.auth.signOut();

  document.getElementById("dashboard").style.display =
    "none";

  document.getElementById("loginBox").style.display =
    "block";
}


async function showDashboard() {

  document.getElementById("loginBox").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  loadAppointments();
}


async function loadAppointments() {

  const loading =
    document.getElementById("loading");

  const table =
    document.getElementById("appointments");

  loading.innerText =
    "جاري تحميل الحجوزات...";

  table.innerHTML = "";

  const { data, error } =
    await client
      .from("appointments")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    loading.innerText =
      "حدث خطأ أثناء تحميل الحجوزات: " +
      error.message;

    return;
  }

  loading.innerText = "";

if (!data || data.length === 0) {
    document.getElementById("pendingCount").textContent = 0;
    document.getElementById("completedCount").textContent = 0;
    document.getElementById("cancelledCount").textContent = 0;
    document.getElementById("totalCount").textContent = 0;

    loading.innerText = "لا توجد حجوزات حالياً";
    return;
}
document.getElementById("totalCount").textContent = data.length;

const pendingCount = data.filter(item =>
    !item.status || item.status === "pending"
).length;

const completedCount = data.filter(item =>
    item.status === "completed"
).length;

const cancelledCount = data.filter(item =>
    item.status === "cancelled"
).length;

document.getElementById("pendingCount").textContent = pendingCount;
document.getElementById("completedCount").textContent = completedCount;
document.getElementById("cancelledCount").textContent = cancelledCount;

 data.forEach(item => {

    const row =
        document.createElement("tr");

    row.dataset.status = item.status || "pending";

    const values = [
      item.name || item.patient_name || "-",
      item.phone || "-",
      item.exam || item.exam_type || "-",
      item.date || item.appointment_date || "-",
      item.time || item.appointment_time || "-",
      item.status === "completed" ? "🟢 تم الفحص" :
item.status === "cancelled" ? "🔴 ملغي" :
"🟡 قيد الانتظار"
    ];

    values.forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      row.appendChild(td);
    });
    const actionTd = document.createElement("td");

const deleteButton = document.createElement("button");
    const statusButton = document.createElement("button");
statusButton.textContent = "🔄 تغيير الحالة";
statusButton.style.background = "#f39c12";
statusButton.style.color = "white";
statusButton.style.padding = "7px 12px";
statusButton.style.border = "none";
statusButton.style.borderRadius = "6px";
statusButton.style.cursor = "pointer";
statusButton.style.marginLeft = "5px";
    statusButton.onclick = async () => {

  const currentStatus = item.status || "pending";

  let newStatus;

  if (currentStatus === "pending") {
    newStatus = "completed";
  } else if (currentStatus === "completed") {
    newStatus = "cancelled";
  } else {
    newStatus = "pending";
  }

  const { error } = await client
    .from("appointments")
    .update({ status: newStatus })
    .eq("id", item.id);

  if (error) {
    alert("حدث خطأ: " + error.message);
    return;
  }

  loadAppointments();
};
deleteButton.textContent = "حذف 🗑️";
deleteButton.style.background = "#c0392b";
deleteButton.style.color = "white";
deleteButton.style.padding = "7px 12px";
deleteButton.style.border = "none";
deleteButton.style.borderRadius = "6px";
deleteButton.style.cursor = "pointer";

deleteButton.onclick = async () => {
    if (!confirm("هل أنت متأكد من حذف هذا الحجز؟")) return;

    const { error } = await client
        .from("appointments")
        .delete()
        .eq("id", item.id);

    if (error) {
        alert("حدث خطأ أثناء الحذف: " + error.message);
        return;
    }

    alert("تم حذف الحجز بنجاح ✅");
    loadAppointments();
};
const editButton = document.createElement("button");
editButton.textContent = "✏️ تعديل";
editButton.style.background = "#087f9c";
editButton.style.color = "white";
editButton.style.padding = "7px 12px";
editButton.style.border = "none";
editButton.style.borderRadius = "6px";
editButton.style.cursor = "pointer";
editButton.style.marginLeft = "5px";

editButton.onclick = async () => {
    const newName = prompt("اسم المريض:", item.name || item.patient_name || "");
    if (newName === null) return;

    const newPhone = prompt("رقم الهاتف:", item.phone || "");
    if (newPhone === null) return;

    const newExam = prompt("نوع الفحص:", item.exam || item.exam_type || "");
    if (newExam === null) return;

    const newDate = prompt("تاريخ الموعد:", item.date || item.appointment_date || "");
    if (newDate === null) return;

    const newTime = prompt("وقت الموعد:", item.time || item.appointment_time || "");
    if (newTime === null) return;

    const { error } = await client
        .from("appointments")
        .update({
            patient_name: newName,
            phone: newPhone,
            exam_type: newExam,
            appointment_date: newDate,
            appointment_time: newTime
        })
        .eq("id", item.id);

    if (error) {
        alert("حدث خطأ أثناء التعديل: " + error.message);
        return;
    }

    alert("✅ تم تعديل الحجز بنجاح");
    loadAppointments();
};

actionTd.appendChild(statusButton);
actionTd.appendChild(editButton);
actionTd.appendChild(deleteButton);
row.appendChild(actionTd);

    table.appendChild(row);
  });
}


async function checkSession() {

  const {
    data: { session }
  } =
    await client.auth.getSession();

  if (session) {
    showDashboard();
  }

}

checkSession();

  function searchAppointments() {
    const input = document.getElementById("searchInput");
    const filter = input.value.toLowerCase().trim();
    const table = document.getElementById("appointments");
    const rows = table.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent.toLowerCase();

        if (text.includes(filter)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
function filterByDate() {
    const selectedDate = document.getElementById("dateFilter").value;
    const table = document.getElementById("appointments");
    const rows = table.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent;

        if (selectedDate === "" || text.includes(selectedDate)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
function filterByExam() {
    const selectedExam = document.getElementById("examFilter").value;
    const table = document.getElementById("appointments");
    const rows = table.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent;

        if (selectedExam === "" || text.includes(selectedExam)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
  function filterByStatus(status) {
    const table = document.getElementById("appointments");
    const rows = table.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {
        const rowStatus = rows[i].dataset.status;

        if (status === "all" || rowStatus === status) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>
