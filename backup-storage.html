<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسخة احتياطية - ملفات الأشعة</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #087f5b;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      line-height: 1.8;
    }

    progress {
      width: 100%;
      height: 25px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>نسخة احتياطية لملفات الأشعة</h2>

  <p>تنزيل ملفات radiology-files إلى الحاسبة</p>

  <input
    type="password"
    id="backupKey"
    placeholder="أدخل مفتاح النسخة الاحتياطية"
  >

  <br>

  <button id="backupBtn" onclick="startBackup()">
    بدء النسخة الاحتياطية
  </button>

  <progress id="progress" value="0" max="100"></progress>

  <div id="status">جاهز</div>
</div>

<script>

const FUNCTION_URL =
  "https://kpxonagjclpmwwoczwog.supabase.co/functions/v1/backup-radiology-files";

async function startBackup() {

  const key =
    document.getElementById("backupKey").value.trim();

  const button =
    document.getElementById("backupBtn");

  const status =
    document.getElementById("status");

  const progress =
    document.getElementById("progress");

  if (!key) {
    status.innerHTML =
      "❌ أدخل مفتاح النسخة الاحتياطية";
    return;
  }

  button.disabled = true;

  try {

    status.innerHTML =
      "جاري تجهيز قائمة الملفات...";

    const response =
      await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "x-backup-key": key
        }
      });

    if (!response.ok) {
      if (response.status === 401) {
        throw new Error(
          "مفتاح النسخة الاحتياطية غير صحيح"
        );
      }

      throw new Error(
        "تعذر تجهيز النسخة الاحتياطية"
      );
    }

    const data =
      await response.json();

    const files =
      data.files || [];

    if (!files.length) {
      throw new Error(
        "لم يتم العثور على ملفات"
      );
    }

    progress.max = files.length;
    progress.value = 0;

    status.innerHTML =
      "تم العثور على " +
      files.length +
      " ملف. جاري التنزيل...";

    for (let i = 0; i < files.length; i++) {

      const file = files[i];

      status.innerHTML =
        "جاري تنزيل الملف " +
        (i + 1) +
        " من " +
        files.length +
        "<br>" +
        file.path;

      const fileResponse =
        await fetch(file.url);

      if (!fileResponse.ok) {
        progress.value = i + 1;
        continue;
      }

      const blob =
        await fileResponse.blob();

      const objectUrl =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = objectUrl;

      link.download =
        file.path
          .replaceAll("/", "_");

      document.body.appendChild(link);

      link.click();
      link.remove();

      URL.revokeObjectURL(objectUrl);

      progress.value = i + 1;

      await new Promise(
        resolve => setTimeout(resolve, 300)
      );
    }

    status.innerHTML =
      "✅ اكتملت النسخة الاحتياطية: " +
      files.length +
      " ملف";

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ " + error.message;

  } finally {

    button.disabled = false;

  }
}

</script>

</body>
</html>
