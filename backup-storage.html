<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نسخة احتياطية - ملفات الأشعة</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    button {
      background: #087f5b;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      line-height: 1.8;
    }

    progress {
      width: 100%;
      height: 25px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>نسخة احتياطية لملفات الأشعة</h2>

  <p>
    تنزيل ملفات radiology-files إلى الحاسبة
  </p>

  <button id="backupBtn" onclick="startBackup()">
    بدء النسخة الاحتياطية
  </button>

  <progress id="progress" value="0" max="100"></progress>

  <div id="status">
    جاهز
  </div>

</div>


<script>

const SUPABASE_URL =
"https://kpxonagjclpmwwoczwog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Svs8n3EuWTtMngtjw6MEnA_QU-dd0z8";


async function getAllFiles() {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/storage.objects?select=name&bucket_id=eq.radiology-files&order=name",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!response.ok) {
    throw new Error(
      "تعذر قراءة قائمة الملفات"
    );
  }

  return await response.json();
}


function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}


async function startBackup() {

  const button =
    document.getElementById("backupBtn");

  const status =
    document.getElementById("status");

  const progress =
    document.getElementById("progress");

  button.disabled = true;

  try {

    status.innerHTML =
      "جاري قراءة قائمة الملفات...";

    const files =
      await getAllFiles();

    if (!files.length) {
      throw new Error(
        "لم يتم العثور على ملفات"
      );
    }

    progress.max =
      files.length;

    progress.value = 0;


    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        files[i];

      status.innerHTML =
        "جاري تنزيل الملف " +
        (i + 1) +
        " من " +
        files.length +
        "<br>" +
        file.name;


      const response =
        await fetch(
          SUPABASE_URL +
          "/functions/v1/doctor-file?path=" +
          encodeURIComponent(file.name)
        );


      if (!response.ok) {
        console.warn(
          "تعذر تنزيل:",
          file.name
        );

        progress.value =
          i + 1;

        continue;
      }


      const data =
        await response.json();


      const fileUrl =
        data.signedUrl ||
        data.signed_url ||
        data.url;


      if (!fileUrl) {
        console.warn(
          "لا يوجد رابط:",
          file.name
        );

        progress.value =
          i + 1;

        continue;
      }


      const link =
        document.createElement("a");

      link.href =
        fileUrl;

      link.download =
        file.name
          .split("/")
          .pop();

      document.body
        .appendChild(link);

      link.click();

      link.remove();


      progress.value =
        i + 1;


      await sleep(700);

    }


    status.innerHTML =
      "✅ اكتملت محاولة تنزيل " +
      files.length +
      " ملف.";

  }

  catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ حدث خطأ: " +
      error.message;

  }

  finally {

    button.disabled =
      false;

  }

}

</script>

</body>
</html>
