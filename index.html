<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قسم الأشعة والمفراس | مستشفى المثنى الأهلي</title>

  <style>
    * {
      .logo-box {
  margin-bottom: 12px;
}

.logo-box img {
  width: 190px;
  max-width: 70%;
  height: auto;
  display: block;
  margin: 0 auto;

    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      color: #17202a;
    }

    header {
      background: white;
      padding: 25px 15px;
      text-align: center;
      border-bottom: 4px solid #00a9e0;
    }

    .logo-box {
      font-size: 55px;
      color: #00a9e0;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #667085;
      font-size: 16px;
    }

    .hero {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #667085;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .card {
      max-width: 550px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 20px;
      color: #00a9e0;
    }

    label {
      display: block;
      text-align: right;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #00a9e0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #667085;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero {
        margin-top: 20px;
      }

      .hero h2 {
        font-size: 25px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo-box">
  <img src="hospital-logo.jpg.jpg" alt="شعار مستشفى المثنى الأهلي">
</div>

  <h1>مستشفى المثنى الأهلي</h1>
  <p>قسم الأشعة والمفراس</p>
</header>

<section class="hero">

  <h2>نظام حجز مواعيد الأشعة والمفراس</h2>

  <p>
    أهلاً بكم في منصة حجز مواعيد قسم الأشعة والمفراس
    في مستشفى المثنى الأهلي
  </p>

  <div class="card">

    <h3>حجز موعد جديد</h3>

    <label>اسم المريض</label>
<input id="patient_name" type="text" placeholder="ادخل الاسم الكامل">

<label>رقم الهاتف</label>
<input id="phone" type="tel" placeholder="07XXXXXXXXX">

<label>نوع الفحص</label>
<select id="exam_type">
    <option value="">اختر نوع الفحص</option>
    <option value="CT">مفراس - CT</option>
    <option value="X-Ray">أشعة - X-Ray</option>
</select>

<label>تاريخ الموعد</label>
<input id="appointment_date" type="date">

<label>وقت الموعد</label>
<input id="appointment_time" type="time">

<button id="booking_button" type="button">تأكيد الحجز</button>

  </div>

</section>

<footer>
  <a href="admin.html" style="display:inline-block; margin-bottom:12px; color:#087f9c; text-decoration:none; font-weight:bold;">
🔐 دخول الإدارة
</a>
  <p>قسم الأشعة والمفراس - مستشفى المثنى الأهلي</p>
  <p>إدارة مسؤول القسم: مرتضى الخفاجي</p>
  <p>للاتصال: 7174</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://kpxonagjclpmwwoczwog.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Svs8n3EuWTtMngtjw6MEnA_QU-dd0z8';

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  document.getElementById('booking_button').addEventListener('click', async function () {

  const patient_name = document.getElementById('patient_name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const exam_type = document.getElementById('exam_type').value;
  const appointment_date = document.getElementById('appointment_date').value;
  const appointment_time = document.getElementById('appointment_time').value;

  if (!patient_name || !phone || !exam_type || !appointment_date || !appointment_time) {
    alert('يرجى ملء جميع معلومات الحجز');
    return;
  }

  const booking_code = 'RAD-' + Date.now().toString().slice(-6);

  const { error } = await supabaseClient
    .from('appointments')
    .insert([{
      patient_name: patient_name,
      phone: phone,
      exam_type: exam_type,
      appointment_date: appointment_date,
      appointment_time: appointment_time,
      status: 'pending',
      booking_code: booking_code
    }]);

  if (error) {
    console.error(error);
    alert('حدث خطأ أثناء الحجز: ' + error.message);
    return;
  }

  alert('تم الحجز بنجاح ✅\nرقم الحجز: ' + booking_code);
});
</script>
</body>
</html>
